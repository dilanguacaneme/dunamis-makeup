spring.application.name=dunamis-makeup-test

# Base de datos en memoria H2 con dialecto compatible con PostgreSQL (RF-018)
spring.datasource.url=jdbc:h2:mem:dunamis_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Esquema limpio y efímero para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de sesión y CORS de prueba
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.allowed-origins=http://localhost:5173

# Credenciales de prueba autónomas para evitar requerir variables de entorno en tests (RF-018)
app.admin.maryuri-password=TestMaryuri123*
app.admin.caterin-password=TestCaterin123*
