spring.application.name=dunamis-makeup

# Conexion local de PostgreSQL. DB_USERNAME es un rol de PostgreSQL,
# separado del nombre de la base de datos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dunamis_makeup}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate actualiza las tablas, pero no crea la base de datos.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Se usan al crear por primera vez las cuentas administradoras.
app.admin.maryuri-password=${ADMIN_MARYURI_PASSWORD:}
app.admin.caterin-password=${ADMIN_CATERIN_PASSWORD:}
